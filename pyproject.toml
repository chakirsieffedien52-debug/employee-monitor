[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-monitor"
version = "0.2.0"
description = "Local-first, privacy-conscious desk activity monitoring demo."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Employee Monitor contributors" }]
dependencies = [
  "ultralytics>=8.2,<9",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
  "python-dotenv>=1.0,<2",
  "numpy>=1.23",
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5",
  "black>=24",
  "pre-commit>=3.7",
]

[project.scripts]
employee-monitor = "employee_monitor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

